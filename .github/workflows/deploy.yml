name: Build & Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # Cho phép chạy thủ công từ GitHub UI

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mikamokedo/cuthongminh-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout code ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js with npm cache ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # ── 3. Install dependencies ──
      - name: Install dependencies
        run: npm ci

      # ── 4. Create .env for build-time variables ──
      # NEXT_PUBLIC_* vars are inlined into JS bundle at build time
      - name: Create build env file
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.production
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.production
          echo "NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}" >> .env.production
          echo "NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}" >> .env.production
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .env.production
          echo "SENTRY_ORG=${{ secrets.SENTRY_ORG }}" >> .env.production
          echo "SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}" >> .env.production

      # ── 5. Build Next.js (standalone output) ──
      - name: Build Next.js
        run: npm run build
        env:
          CI: true
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # ── 6. Login to GitHub Container Registry ──
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 7. Setup Docker Buildx ──
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 8. Build & Push Docker image ──
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ── 9. Sync docker-compose.deploy.yml to VPS ──
      - name: Sync docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "docker-compose.deploy.yml"
          target: "/var/www/cuthongminh.com/frontend/"

      # ── 11. Deploy to VPS ──
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: GHCR_TOKEN
          script: |
            # Login to GHCR to pull private image
            echo "$GHCR_TOKEN" | docker login ghcr.io -u mikamokedo --password-stdin

            # Pull latest image
            docker pull ghcr.io/mikamokedo/cuthongminh-web:latest

            # Restart container
            cd /var/www/cuthongminh.com/frontend
            docker compose -f docker-compose.deploy.yml up -d --force-recreate

            # Cleanup old/dangling images to save disk space on 2GB VPS
            docker image prune -f

            echo "✅ Deploy completed successfully!"
