name: Build & Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # Cho phép chạy thủ công từ GitHub UI

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mikamokedo/cuthongminh-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout code ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js with npm cache ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # ── 3. Install dependencies ──
      - name: Install dependencies
        run: npm ci

      # ── 4. Create .env for build-time variables ──
      # NEXT_PUBLIC_* vars are inlined into JS bundle at build time
      - name: Create build env file
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.production
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.production
          echo "NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}" >> .env.production
          echo "NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}" >> .env.production
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .env.production
          echo "SENTRY_ORG=${{ secrets.SENTRY_ORG }}" >> .env.production
          echo "SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}" >> .env.production
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env.production

      # ── 5. Build Next.js (standalone output) ──
      - name: Build Next.js
        run: npm run build
        env:
          CI: true
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # ── 6. Login to GitHub Container Registry ──
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 7. Setup Docker Buildx ──
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 8. Build & Push Docker image ──
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ── 9. Deployment handled by Watchtower on VPS ──
      # Watchtower monitors GHCR and auto-pulls + restarts when new image is pushed.
      # No SSH/SCP needed — eliminates i/o timeout issues completely.
      - name: Verify image pushed
        run: |
          echo "✅ Image pushed to GHCR successfully!"
          echo "🔄 Watchtower on VPS will auto-deploy within ~30 seconds"
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
