<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <!-- Body -->
  <ellipse id="body" cx="200" cy="240" rx="90" ry="70" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <!-- Head -->
  <circle id="head" cx="200" cy="140" r="60" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <!-- Left ear -->
  <path id="left-ear" d="M155,100 L135,50 L170,85 Z" fill="#f0f0f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right ear -->
  <path id="right-ear" d="M245,100 L265,50 L230,85 Z" fill="#f0f0f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Tail -->
  <path id="tail" d="M285,260 Q330,240 340,200 Q345,170 320,160" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="178" cy="130" rx="10" ry="12" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
  <ellipse cx="222" cy="130" rx="10" ry="12" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
  <ellipse cx="180" cy="128" rx="5" ry="7" fill="#333"/>
  <ellipse cx="224" cy="128" rx="5" ry="7" fill="#333"/>
  <!-- Nose -->
  <path d="M196,148 L200,155 L204,148 Z" fill="#FF9999" stroke="#333" stroke-width="1.5"/>
  <!-- Mouth -->
  <path d="M200,155 Q192,165 185,160" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <path d="M200,155 Q208,165 215,160" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="170" y1="150" x2="120" y2="142" stroke="#333" stroke-width="1.5"/>
  <line x1="170" y1="155" x2="120" y2="158" stroke="#333" stroke-width="1.5"/>
  <line x1="230" y1="150" x2="280" y2="142" stroke="#333" stroke-width="1.5"/>
  <line x1="230" y1="155" x2="280" y2="158" stroke="#333" stroke-width="1.5"/>
  <!-- Paws -->
  <ellipse cx="155" cy="300" rx="20" ry="12" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
  <ellipse cx="245" cy="300" rx="20" ry="12" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
</svg>
