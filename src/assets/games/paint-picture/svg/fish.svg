<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Fish body -->
  <path id="body" d="M200,80 Q300,60 320,150 Q300,240 200,220 Q120,200 120,150 Q120,100 200,80 Z" fill="#f0f0f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Tail -->
  <path id="tail" d="M120,150 Q80,100 60,70 Q90,130 60,150 Q90,170 60,230 Q80,200 120,150 Z" fill="#f0f0f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Top fin -->
  <path id="top-fin" d="M200,80 Q220,30 260,50 Q240,80 240,90" fill="#f0f0f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Bottom fin -->
  <path id="bottom-fin" d="M200,220 Q220,260 250,250 Q240,225 230,215" fill="#f0f0f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eye -->
  <circle id="eye" cx="270" cy="135" r="15" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <circle cx="273" cy="132" r="6" fill="#333"/>
  <!-- Mouth -->
  <path d="M310,155 Q320,160 310,165" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Scales pattern -->
  <path d="M180,120 Q200,110 210,130" fill="none" stroke="#333" stroke-width="1.5" opacity="0.4"/>
  <path d="M170,150 Q190,140 200,160" fill="none" stroke="#333" stroke-width="1.5" opacity="0.4"/>
  <path d="M180,180 Q200,170 210,190" fill="none" stroke="#333" stroke-width="1.5" opacity="0.4"/>
  <path d="M210,135 Q230,125 240,145" fill="none" stroke="#333" stroke-width="1.5" opacity="0.4"/>
  <path d="M210,165 Q230,155 240,175" fill="none" stroke="#333" stroke-width="1.5" opacity="0.4"/>
</svg>
