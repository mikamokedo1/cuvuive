<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <!-- Stem -->
  <path id="stem" d="M200,170 L200,310" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <!-- Left leaf -->
  <path id="left-leaf" d="M200,250 Q150,230 140,260 Q150,280 200,270" fill="#f0f0f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right leaf -->
  <path id="right-leaf" d="M200,220 Q250,200 260,230 Q250,250 200,240" fill="#f0f0f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Center circle -->
  <circle id="center" cx="200" cy="120" r="30" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <!-- Petals -->
  <ellipse id="petal-top" cx="200" cy="65" rx="25" ry="35" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <ellipse id="petal-right" cx="252" cy="100" rx="25" ry="35" fill="#f0f0f0" stroke="#333" stroke-width="3" transform="rotate(72 252 100)"/>
  <ellipse id="petal-bottom-right" cx="232" cy="155" rx="25" ry="35" fill="#f0f0f0" stroke="#333" stroke-width="3" transform="rotate(144 232 155)"/>
  <ellipse id="petal-bottom-left" cx="168" cy="155" rx="25" ry="35" fill="#f0f0f0" stroke="#333" stroke-width="3" transform="rotate(-144 168 155)"/>
  <ellipse id="petal-left" cx="148" cy="100" rx="25" ry="35" fill="#f0f0f0" stroke="#333" stroke-width="3" transform="rotate(-72 148 100)"/>
  <!-- Center dots -->
  <circle cx="190" cy="115" r="4" fill="#333" opacity="0.3"/>
  <circle cx="210" cy="115" r="4" fill="#333" opacity="0.3"/>
  <circle cx="200" cy="130" r="4" fill="#333" opacity="0.3"/>
</svg>
