<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <!-- Body -->
  <ellipse id="body" cx="200" cy="220" rx="80" ry="90" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <!-- Belly patch -->
  <ellipse id="belly" cx="200" cy="240" rx="50" ry="55" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
  <!-- Head -->
  <circle id="head" cx="200" cy="110" r="55" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <!-- Left ear -->
  <circle id="left-ear" cx="155" cy="75" r="22" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <circle cx="155" cy="75" r="10" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <!-- Right ear -->
  <circle id="right-ear" cx="245" cy="75" r="22" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <circle cx="245" cy="75" r="10" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <!-- Muzzle -->
  <ellipse cx="200" cy="130" rx="25" ry="18" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="180" cy="100" r="8" fill="#333"/>
  <circle cx="220" cy="100" r="8" fill="#333"/>
  <circle cx="183" cy="97" r="3" fill="white"/>
  <circle cx="223" cy="97" r="3" fill="white"/>
  <!-- Nose -->
  <ellipse cx="200" cy="122" rx="8" ry="6" fill="#333"/>
  <!-- Mouth -->
  <path d="M190,132 Q200,142 210,132" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Left arm -->
  <path id="left-arm" d="M125,190 Q90,200 85,230 Q85,245 100,245 Q110,245 115,235" fill="#f0f0f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right arm -->
  <path id="right-arm" d="M275,190 Q310,200 315,230 Q315,245 300,245 Q290,245 285,235" fill="#f0f0f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Left foot -->
  <ellipse cx="165" cy="310" rx="30" ry="15" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <!-- Right foot -->
  <ellipse cx="235" cy="310" rx="30" ry="15" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
</svg>
