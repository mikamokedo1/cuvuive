<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Car body -->
  <path id="car-body" d="M60,180 L60,220 Q60,240 80,240 L320,240 Q340,240 340,220 L340,180 Q340,160 320,160 L80,160 Q60,160 60,180 Z" fill="#f0f0f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Car top/cabin -->
  <path id="car-top" d="M120,160 L140,100 Q145,90 155,90 L245,90 Q255,90 260,100 L280,160 Z" fill="#f0f0f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Window left -->
  <path id="window-left" d="M135,155 L150,110 L195,110 L195,155 Z" fill="#f0f0f0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Window right -->
  <path id="window-right" d="M205,155 L205,110 L250,110 L265,155 Z" fill="#f0f0f0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Left wheel -->
  <circle id="wheel-left" cx="120" cy="240" r="28" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <circle cx="120" cy="240" r="12" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <!-- Right wheel -->
  <circle id="wheel-right" cx="280" cy="240" r="28" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <circle cx="280" cy="240" r="12" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <!-- Headlight -->
  <circle cx="335" cy="190" r="10" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <!-- Taillight -->
  <rect x="55" y="185" width="8" height="15" rx="3" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <!-- Door line -->
  <line x1="200" y1="160" x2="200" y2="235" stroke="#333" stroke-width="1.5" opacity="0.3"/>
  <!-- Door handle -->
  <line x1="220" y1="195" x2="240" y2="195" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
</svg>
