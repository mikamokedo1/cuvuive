<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <!-- Body -->
  <rect id="body" x="140" y="120" width="120" height="120" rx="10" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <!-- Head -->
  <rect id="head" x="155" y="55" width="90" height="75" rx="12" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <!-- Antenna -->
  <line x1="200" y1="55" x2="200" y2="30" stroke="#333" stroke-width="4"/>
  <circle cx="200" cy="24" r="8" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <!-- Eyes -->
  <rect x="170" y="72" width="22" height="18" rx="4" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
  <rect x="208" y="72" width="22" height="18" rx="4" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
  <circle cx="181" cy="81" r="5" fill="#333"/>
  <circle cx="219" cy="81" r="5" fill="#333"/>
  <!-- Mouth -->
  <rect x="180" y="100" width="40" height="8" rx="4" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="190" y1="100" x2="190" y2="108" stroke="#333" stroke-width="1.5"/>
  <line x1="200" y1="100" x2="200" y2="108" stroke="#333" stroke-width="1.5"/>
  <line x1="210" y1="100" x2="210" y2="108" stroke="#333" stroke-width="1.5"/>
  <!-- Left arm -->
  <path id="left-arm" d="M140,150 L90,140 Q80,138 80,148 L80,165 Q80,175 90,173 L140,170" fill="#f0f0f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right arm -->
  <path id="right-arm" d="M260,150 L310,140 Q320,138 320,148 L320,165 Q320,175 310,173 L260,170" fill="#f0f0f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Left leg -->
  <rect id="left-leg" x="155" y="240" width="35" height="50" rx="6" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <!-- Right leg -->
  <rect id="right-leg" x="210" y="240" width="35" height="50" rx="6" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  <!-- Left foot -->
  <ellipse cx="172" cy="295" rx="25" ry="10" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
  <!-- Right foot -->
  <ellipse cx="227" cy="295" rx="25" ry="10" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
  <!-- Belly details -->
  <circle cx="200" cy="170" r="15" fill="none" stroke="#333" stroke-width="1.5" opacity="0.3"/>
  <rect x="170" y="195" width="60" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5" opacity="0.3"/>
</svg>
